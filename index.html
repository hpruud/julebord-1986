<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ACADEMY - JULEBORD 1986 DEMO</title>
  <!-- Inline SVG favicon: a green pixel-art Christmas tree on black, so the
       browser stops auto-fetching /favicon.ico (which 404s on GitHub Pages
       since we don't ship a favicon file). data: URI, zero network cost. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M7 2h2v2h1v1h1v2h1v1h1v2h1v1H1v-1h1V8h1V7h1V5h1V4h1V2zm0 11h2v2H7z' fill='%231a6b1a'/%3E%3Cpath d='M5 6h1v1H5zM10 8h1v1h-1zM6 10h1v1H6zM9 11h1v1H9z' fill='%23ff4d4d'/%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #ddd;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    }
    #boot .inner {
      text-align: center;
      letter-spacing: 2px;
    }
    #boot h1 {
      font-size: 36px;
      margin: 0 0 12px 0;
      color: #ff4d4d;
      text-shadow: 2px 2px 0 #1a6b1a;
    }
    #boot h2 {
      font-size: 18px;
      margin: 0 0 18px 0;
      color: #cfa657;
      letter-spacing: 3px;
    }
    #boot p { margin: 6px 0; font-size: 14px; }
    #boot small {
      color: #888;
      letter-spacing: 0;
      line-height: 1.6;
      display: inline-block;
      max-width: 520px;
    }
    #hint {
      position: fixed;
      right: 6px;
      bottom: 4px;
      font-size: 10px;
      color: #555;
      z-index: 5;
      pointer-events: none;
      font-family: monospace;
      letter-spacing: 0;
      white-space: nowrap;
      padding: 1px 3px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="cv" width="320" height="256"></canvas>
  </div>
  <div id="boot">
    <div class="inner">
      <h1>JULEBORD 1986 DEMO</h1>
      <h2>ACADEMY (c) 2026</h2>
      <p style="margin-top:24px;">Click anywhere to start...</p>
      <small>SPACE/click skip part &middot; P pause &middot; M mute &middot; F fullscreen &middot; ESC exit &middot; C toggle CRT</small>
    </div>
  </div>
  <div id="hint">SPC/click&nbsp;skip·P&nbsp;pause·M&nbsp;mute·F&nbsp;full·C&nbsp;CRT·ESC&nbsp;exit</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
